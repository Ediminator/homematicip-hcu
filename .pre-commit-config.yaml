# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending

  # Same check as CI: runs mypy from the active environment (install
  # requirements_test.txt first, so Home Assistant types are available)
  # and fails only on errors not listed in mypy-baseline.txt.
  - repo: local
    hooks:
      - id: mypy-baseline
        name: mypy (baseline)
        entry: scripts/check_mypy.sh
        language: system
        pass_filenames: false
        files: ^(custom_components/.*\.py|mypy-baseline\.txt|pyproject\.toml)$

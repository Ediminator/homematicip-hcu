[project]
name = "hcu-integration"
version = "0.0.0"
description = "Homematic IP Local (HCU) Custom Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "getmac>=0.8.0",
    "requests>=2.31.0",
    "zeroconf>=0.131.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "tests/mock_hass",
]
testpaths = ["tests"]

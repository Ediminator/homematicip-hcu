[tool.ruff]
# Home Assistant 2025.x runs on Python 3.13; newer releases on 3.14.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC", # async pitfalls (blocking calls in the event loop)
  "B",     # flake8-bugbear
  "BLE",   # blind except (each remaining case is marked with a reason)
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "FLY",   # static joins
  "G",     # logging format
  "I",     # import sorting
  "LOG",   # logging misuse
  "PERF",  # performance anti-patterns
  "PIE",   # misc lints
  "RET",   # return statements
  "RUF",   # ruff-specific rules
  "SIM",   # simplifications
  "TRY",   # exception handling
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  # The security checks Home Assistant core enables (exec/eval, shell, pickle,
  # XML parsing, SQL strings, hardcoded temp paths, ...).
  "S102", "S103", "S107", "S108", "S301", "S306", "S307",
  "S313", "S314", "S315", "S316", "S317", "S318", "S319",
  "S601", "S602", "S604", "S608", "S609",
]
ignore = [
  "E501",   # line length is handled by the formatter
  "SIM102", # nested ifs often carry comments; collapsing them hurts readability
  "RUF012", # HA declares _attr_* as instance attributes; ClassVar overrides break mypy
  "RUF001", # German translations contain non-ASCII lookalikes on purpose
  "RUF002",
  "RUF003",
  "TRY003", # long messages in exception constructors (also ignored by HA core)
  "TRY400", # logging.error in except blocks is deliberate for expected errors (also ignored by HA core)
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
  "BLE001", # the probe script reports every connection failure instead of crashing
]
"tests/**" = [
  "B017",   # pytest.raises(Exception) is used deliberately in a few tests
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.mypy_baseline]
# Known mypy errors at the time strict checking was introduced. CI fails only
# on errors that are not in this file. Run
#   mypy custom_components/hcu_integration | mypy-baseline sync
# after fixing errors to shrink it.
baseline_path = "mypy-baseline.txt"
sort_baseline = true

[tool.coverage.report]
# Home Assistant quality scale (Silver) expects more than 95% test coverage.
# CI runs pytest with --cov, which fails below this threshold.
fail_under = 95
show_missing = true
skip_covered = true

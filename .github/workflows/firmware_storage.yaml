name: Update Firmware Storage
on:
  #push:
  schedule:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create local changes
        run: bash .github/workflows/download_all.sh

      - name: Commit & Push changes
        uses: actions-js/push@v1.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'main'

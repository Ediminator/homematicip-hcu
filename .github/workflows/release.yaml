name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach hcu_integration.zip to (defaults to latest release)"
        required: false
        type: string

jobs:
  package-release:
    name: "Build & Upload HACS Release Asset"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine target tag
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --json tagName --jq '.tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The check script comes from the commit that runs this workflow, so a
      # manual run can also backfill older tags that predate the script.
      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Check release version
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          python3 scripts/check_release.py --tag "$TAG" --root release

      - name: Build hcu_integration.zip
        run: |
          cd release/custom_components/hcu_integration
          zip -r "$GITHUB_WORKSPACE/hcu_integration.zip" . -x "*/__pycache__/*" "*.pyc"

      - name: Check hcu_integration.zip
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          python3 scripts/check_release.py --tag "$TAG" --root release --zip hcu_integration.zip

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release upload "$TAG" hcu_integration.zip --clobber

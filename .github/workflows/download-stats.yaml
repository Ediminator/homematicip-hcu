name: Update Download Stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch download stats
        run: python .github/scripts/update_download_stats.py

      - name: Generate download chart
        run: python .github/scripts/generate_download_chart.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .docs/downloads
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update download stats"
            git push
          fi

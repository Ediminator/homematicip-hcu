name: Update Download Stats

on:
  schedule:
    - cron: "1 2 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Stats live on the separate "stats" branch so that main can require
      # pull requests (GITHUB_TOKEN cannot bypass branch rulesets).
      # If the branch exists but the restore fails, stop here: continuing
      # would publish a fresh, empty history over the existing one.
      - name: Restore previous stats from stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats; then
            git fetch origin stats
            git checkout origin/stats -- .docs/downloads
          fi

      - name: Fetch download stats
        run: python .github/scripts/update_download_stats.py

      - name: Generate download chart
        run: python .github/scripts/generate_download_chart.py

      - name: Publish to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats; then
            git worktree add -B stats /tmp/stats origin/stats
          else
            git worktree add --orphan -b stats /tmp/stats
          fi
          mkdir -p /tmp/stats/.docs
          rm -rf /tmp/stats/.docs/downloads
          cp -r .docs/downloads /tmp/stats/.docs/downloads
          cd /tmp/stats
          git add .docs/downloads
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update download stats"
            git push origin stats
          fi
